[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hotel317-variant01-vulnerable"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["psycopg[binary]>=3.2,<4", "fastapi>=0.118,<1", "uvicorn>=0.34,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]
regression = ["pytest>=8,<9", "testcontainers[postgres]>=4.8,<5"]

[tool.setuptools.packages.find]
include = ["hotel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
