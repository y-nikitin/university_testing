server.address=127.0.0.1
server.port=${API_PORT:8080}
spring.config.import=classpath:database-test.properties
spring.datasource.url=${DB_URL:${db.url}}
spring.datasource.username=${DB_USER:${db.user}}
spring.datasource.password=${DB_PASSWORD:${db.password}}
spring.sql.init.mode=never
spring.flyway.enabled=false
logging.level.root = info